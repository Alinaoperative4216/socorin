name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests and coverage
    # macOS: the Rust tests build the app on Tauri's mock runtime, and the
    # global-shortcut and tray plugins need a window-server session, which
    # the macOS runners have. Both coverage floors (75 % lines) are enforced
    # by the commands themselves; see CONTRIBUTING.md.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: npm ci
      - name: Type-check and build the frontend
        run: npm run build
      - name: Frontend tests (75 % line-coverage floor)
        run: npm run test:coverage
      - name: Rust tests (75 % line-coverage floor)
        run: npm run test:rust:coverage

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: npm audit (runtime dependencies)
        run: npm audit --omit=dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-audit
      - name: cargo audit
        run: cargo audit --file src-tauri/Cargo.lock
